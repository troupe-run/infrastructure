# Source: troupe-run/infrastructure (org-profile/.github/ISSUE_TEMPLATE/bug.yml). Change it there; this copy is written by the App.
name: Bug
description: Something doesn't do what it should, or what its specs say.
type: Bug
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Include the exact command, output and exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Link the spec requirement if you know it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest setup and commands that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The version or commit (for example `troupe --version`), and your OS.
