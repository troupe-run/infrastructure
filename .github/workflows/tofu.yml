name: tofu

# Plans and applies the org from CI (spec: ci-apply; ci-apply design).
#
#   pull request          changes   no environment                 does it touch what OpenTofu reads?
#                         pr-plan   env plan-pr (owner approves)   plan posted on the PR, unless not
#   CI green on main  --> plan      env plan-main (main only)      plan in the run summary, with the
#   or a manual run                                                board's descriptions to set; a
#   or daily at 06:00 UTC                                          daily or manual run waits for green
#                                                                  CI on main, and fails if it's red,
#                                                                  or plans nothing if a newer merge
#                                                                  cancelled that CI
#                         apply     env apply (owner approves)     apply that saved plan, then commit
#                                                                  the state to main as the App
#                         board     env board (main only)          after the apply, set the board's
#                                                                  descriptions the plan listed
#   merge queue           pr-plan   skipped: no environment        reports as skipped, so the queue
#                                                                  lands without a second approval
#
# The daily run finds drift in anything OpenTofu manages, a file delivered to troupe included,
# within a day (spec: ci-apply). Beside each plan of main, the oob job checks what OpenTofu can't
# manage (scripts/oob.py, oob/README.md), and fails on any difference.
#
# Each plan of main reads main's current state, whichever commit started the run, so a merge
# another run already applied isn't planned again (scripts/plan_target.py; #167).
#
# Every job authenticates as the troupe-run-infrastructure App, through scripts/tofu.py, with the
# secrets of its environment, but the board job, which uses the troupe-run-board App's (spec:
# labels; board-capability-descriptions design D1). The owner sets them from 1Password (README,
# oob/README.md); none is in this file.
on:
  pull_request:
  # Only so `plan (pull request)`, a required check, reports on each commit a merge queue tests: it
  # reports as skipped, asking for no approval and holding no secret. The owner approved the pull
  # request's plan, and main is planned and approved after the merge (merge-queue design D5).
  merge_group:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # GitHub pauses this after 60 days without activity in the repository; `gh workflow enable
  # tofu.yml` turns it back on (README, "Running a plan").
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

# One plan-and-apply on main at a time, never cancelled: a later merge waits, and then plans
# against the state the earlier run left (design D6). A pull request's plan is replaced by its next.
# A merge queue's run has a group of its own, so it never waits behind an apply awaiting approval.
concurrency:
  group: tofu-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('mq-{0}', github.event.merge_group.head_sha) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENTOFU_VERSION: 1.13.1
  # The App's bot, which commits the state (design D4).
  STATE_AUTHOR: 340938853+troupe-run-infrastructure[bot]@users.noreply.github.com

jobs:
  # Whether a pull request changes anything OpenTofu reads (scripts/plan_needed.py, required-checks
  # design D2). No environment and no secrets. Not a required check itself: if it fails, the plan
  # runs.
  changes:
    name: does it need a plan?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.paths.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: The pull request's changed paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE...$HEAD" | python3 scripts/plan_needed.py >> "$GITHUB_OUTPUT"

  pr-plan:
    name: plan (pull request)
    # A required check (tofu/required-checks.json). Skipped, which counts as passed and asks for no
    # approval, only when `changes` succeeded and found nothing OpenTofu reads.
    needs: changes
    if: >-
      github.event_name == 'pull_request' && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.plan == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner approves each run before it gets the App's key: a pull request runs its own copy of
    # this file. Look at whether it changes .github/workflows/ before approving (design D2).
    environment:
      name: plan-pr
      deployment: false
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_VAR_github_app_pem: ${{ secrets.TF_VAR_github_app_pem }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_billing_email: ${{ secrets.TF_VAR_billing_email }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
    steps:
      - name: Secrets available?
        id: secrets
        run: |
          if [ -z "$TF_VAR_state_passphrase" ]; then
            echo "::notice::No secrets for this run (a fork or Dependabot pull request), so no plan. The owner can plan it locally."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # GitHub's merge ref: the pull request on top of main, so the plan reads main's latest state.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.available == 'true'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.secrets.outputs.available == 'true'
        with:
          python-version: "3.12"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.secrets.outputs.available == 'true'
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - name: Plan
        if: steps.secrets.outputs.available == 'true'
        run: |
          uv run --no-project scripts/tofu.py init -input=false -no-color
          uv run --no-project scripts/tofu.py plan -input=false -no-color -lock=false -out=pr.tfplan
          uv run --no-project scripts/tofu.py show -no-color pr.tfplan > "$RUNNER_TEMP/plan.txt"
      # No rendering of the plan holds a key: the App's, the DNS token or the state passphrase
      # (spec: state-and-apply; ephemeral-state-passphrase D2). Before anything else reads plan.json.
      - name: The plan holds no key
        if: steps.secrets.outputs.available == 'true'
        run: |
          uv run --no-project scripts/tofu.py show -json pr.tfplan > "$RUNNER_TEMP/plan.json"
          uv run --no-project scripts/plan_secrets.py "$RUNNER_TEMP/plan.txt" "$RUNNER_TEMP/plan.json"
      # The whole plan, which the comment links to when it's too long to show (spec: ci-apply;
      # truncate-long-plans D5). Unzipped, so the artifact is plan.txt itself. Only after the check above.
      - name: Keep the full plan
        id: full-plan
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/plan.txt
          archive: false
          if-no-files-found: error
      # The delivered files' modes this plan would leave to set (spec: guard-delivery;
      # executable-hooks design D3). Evidence only: it reads the targets, and writes nothing.
      - name: Modes to set after the apply
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project scripts/hook_modes.py plan --plan-json "$RUNNER_TEMP/plan.json" \
            --out "$RUNNER_TEMP/mode-plan.json" --summary "$RUNNER_TEMP/modes.md"
      # A failed check block is only a warning, and `tofu show` leaves it out of plan.txt (spec: dns;
      # manage-dns-as-code design D5). Annotate the run with each one, and summarise them below.
      - name: Check warnings
        if: steps.secrets.outputs.available == 'true'
        run: |
          uv run --no-project scripts/plan_checks.py --plan-json "$RUNNER_TEMP/plan.json" \
            --summary "$RUNNER_TEMP/checks.md"
      - name: Post the plan on the pull request
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_URL: ${{ steps.full-plan.outputs.artifact-url }}
        run: |
          head="$RUNNER_TEMP/head.md"
          body="$RUNNER_TEMP/comment.md"
          {
            echo "### OpenTofu plan for ${HEAD_SHA:0:7}"
            echo
            echo "$(grep -E '^(Plan:|No changes)' "$RUNNER_TEMP/plan.txt" | head -1)"
            echo
            echo "Made in CI on this pull request merged onto \`main\` ([run]($RUN_URL)). The apply happens after the merge, once the owner approves the plan made then."
            echo
            cat "$RUNNER_TEMP/checks.md"
            echo
            cat "$RUNNER_TEMP/modes.md"
            echo
          } > "$head"
          # Whole if it fits in a comment, otherwise cut at a line with a note and a link to the full
          # plan, every resource change kept (spec: ci-apply; truncate-long-plans D1-D4).
          uv run --no-project scripts/plan_comment.py --target comment --head "$head" \
            --plan "$RUNNER_TEMP/plan.txt" --plan-url "$PLAN_URL" --out "$body"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file "$body"

  plan:
    name: plan (main)
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    # Above the CI wait's 25 minutes and the guard wait's 10, so each says why it gave up.
    timeout-minutes: 45
    environment:
      name: plan-main
      deployment: false
    outputs:
      # OpenTofu's changes, a delivered file's mode to set, or a board description to set: any waits
      # for approval (executable-hooks design D3; board-capability-descriptions design D1).
      changes: ${{ steps.plan.outputs.changes == 'true' || steps.modes.outputs.changes == 'true' || steps.board.outputs.changes == 'true' }}
      mode_repositories: ${{ steps.modes.outputs.repositories }}
      board_changes: ${{ steps.board.outputs.changes }}
      sha: ${{ steps.target.outputs.sha }}
    env:
      TF_VAR_github_app_pem: ${{ secrets.TF_VAR_github_app_pem }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_billing_email: ${{ secrets.TF_VAR_billing_email }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
    steps:
      # main as it is now, not when the run was triggered, with its history: a plan reads the state
      # file of the commit it checks out, and that must be main's current state (spec: ci-apply).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # The commit with this run's declaration and main's current state, or none (#167): main's
      # head for a daily or manual run; after CI, the merge or the App's state commit after it. It
      # never plans the App's own state commit after CI, and says in the summary what it chose and
      # why (scripts/plan_target.py; plan-each-merge-once design D1-D3).
      - name: The commit to plan
        id: target
        env:
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          python3 scripts/plan_target.py --event "$EVENT" --commit "$COMMIT"
          --state-author "$STATE_AUTHOR" --main origin/main --summary "$GITHUB_STEP_SUMMARY"
          >> "$GITHUB_OUTPUT"
      - name: Check out that commit
        if: steps.target.outputs.plan == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: git checkout -q --detach "$SHA"
      # A daily or manual run plans only once CI has passed on main: on the commit CI runs on for
      # main's head, the App's state commits looked past. It waits while CI runs, up to its limit,
      # and fails with the ways to recover when CI isn't green. No input skips it. A run after CI on
      # a merge already follows CI's success (scripts/main_ci.py; plans-wait-for-ci design D1-D6).
      # When a newer merge cancelled that CI, it says superseded=true and every later step is
      # skipped: that merge's own run plans main (red-main-and-undecodable-spec design D1, D2).
      - name: Wait for green CI on main
        id: ci
        if: github.event_name != 'workflow_run' && steps.target.outputs.plan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/main_ci.py --main origin/main --repository "$GITHUB_REPOSITORY"
          --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
      - name: Wait for the guard check on this commit
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # CI has passed: this run follows it after a merge, and the step above waited for it
          # otherwise. The guard is a separate workflow, delivered to troupe as it is, so it is
          # checked here. It runs on the App's state commit's push too, which plan_target.py may
          # name. An apply follows green CI and guard (design D1).
          for _ in $(seq 1 60); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow guard.yml --commit "$SHA" \
              --event push --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success") echo "guard passed on $SHA"; exit 0 ;;
              completed*) echo "::error::guard concluded '$result' on $SHA; not planning."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::guard didn't finish on $SHA within 10 minutes."
          exit 1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        with:
          python-version: "3.12"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - name: Plan
        id: plan
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        run: |
          uv run --no-project scripts/tofu.py init -input=false -no-color
          set +e
          uv run --no-project scripts/tofu.py plan -input=false -no-color -detailed-exitcode -out=main.tfplan
          code=$?
          set -e
          case $code in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          uv run --no-project scripts/tofu.py show -no-color main.tfplan > "$RUNNER_TEMP/plan.txt"
      # No rendering of the plan holds a key: the App's, the DNS token or the state passphrase
      # (spec: state-and-apply; ephemeral-state-passphrase D2). Before anything else reads plan.json.
      - name: The plan holds no key
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        run: |
          uv run --no-project scripts/tofu.py show -json main.tfplan > "$RUNNER_TEMP/plan.json"
          uv run --no-project scripts/plan_secrets.py "$RUNNER_TEMP/plan.txt" "$RUNNER_TEMP/plan.json"
      # As in pr-plan: the whole plan, linked from the summary when it's too long to show.
      - name: Keep the full plan
        id: full-plan
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/plan.txt
          archive: false
          if-no-files-found: error
      # Each delivered file whose mode the apply would leave unlike its source's (spec:
      # guard-delivery; executable-hooks design D1-D3). It only reads; the apply job sets them.
      - name: Modes to set after the apply
        id: modes
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project scripts/hook_modes.py plan --plan-json "$RUNNER_TEMP/plan.json" \
            --out tofu/mode-plan.json --summary "$RUNNER_TEMP/modes.md"
          repositories=$(jq -r '[.entries[].repository] | unique | join(",")' tofu/mode-plan.json)
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
          if [ -n "$repositories" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi
      # The board's Capability options whose description isn't their label's (spec: labels;
      # board-capability-descriptions design D1). OpenTofu can't manage a Projects v2 field, so this
      # is a plan of its own. It only reads, with a token that can only read projects; the board job
      # sets them after the apply. A board that can't be read, token included, is an error annotation
      # and a line in the summary, never a failed plan: a board problem doesn't hold up every apply,
      # and the oob job fails on the same read (design D9).
      - name: A read-only token for the board
        id: board-token
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 5272634
          private-key: ${{ secrets.TF_VAR_github_app_pem }}
          owner: troupe-run
          permission-organization-projects: read
      - name: Board descriptions to set after the apply
        id: board
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ steps.board-token.outputs.token }}
        run: |
          uv run --no-project scripts/board_options.py plan --ci --out tofu/board-plan.json \
            --summary "$RUNNER_TEMP/board.md"
          # No board plan when the board couldn't be read: nothing to set.
          if [ -f tofu/board-plan.json ] && [ "$(jq '.changes | length' tofu/board-plan.json)" != "0" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi
      # As in pr-plan: a failed check block becomes an annotation and a line in the summary.
      - name: Check warnings
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        run: |
          uv run --no-project scripts/plan_checks.py --plan-json "$RUNNER_TEMP/plan.json" \
            --summary "$RUNNER_TEMP/checks.md"
      - name: Show the plan for approval
        if: steps.target.outputs.plan == 'true' && steps.ci.outputs.superseded != 'true'
        env:
          CHANGES: ${{ steps.plan.outputs.changes }}
          MODE_CHANGES: ${{ steps.modes.outputs.changes }}
          BOARD_CHANGES: ${{ steps.board.outputs.changes }}
          SHA: ${{ steps.target.outputs.sha }}
          PLAN_URL: ${{ steps.full-plan.outputs.artifact-url }}
        run: |
          head="$RUNNER_TEMP/head.md"
          {
            echo "### OpenTofu plan for ${SHA:0:7}"
            echo
            if [ "$CHANGES" = "true" ]; then
              echo "**$(grep -E '^Plan:' "$RUNNER_TEMP/plan.txt" | head -1)** The apply job waits for the owner's approval (Review deployments)."
            elif [ "$MODE_CHANGES" = "true" ] || [ "$BOARD_CHANGES" = "true" ]; then
              echo "**No OpenTofu changes, but modes or board descriptions to set (below).** The apply job waits for the owner's approval (Review deployments)."
            else
              echo "No changes. Nothing to approve."
            fi
            echo
            cat "$RUNNER_TEMP/checks.md"
            echo
            cat "$RUNNER_TEMP/modes.md"
            echo
            cat "$RUNNER_TEMP/board.md"
            echo
          } > "$head"
          # Whole if it fits in a step summary, otherwise cut as on a pull request (truncate-long-plans D1-D4).
          uv run --no-project scripts/plan_comment.py --target summary --head "$head" \
            --plan "$RUNNER_TEMP/plan.txt" --plan-url "$PLAN_URL" --out "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the saved plan for the apply job
        if: steps.plan.outputs.changes == 'true' || steps.modes.outputs.changes == 'true' || steps.board.outputs.changes == 'true'
        # Encrypted with the state passphrase, and it holds no key (design D3). The mode plan holds
        # only paths, modes and blob ids; the board plan only the board's options as read and the
        # descriptions to set.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-tfplan
          path: |
            tofu/main.tfplan
            tofu/mode-plan.json
            tofu/board-plan.json
          retention-days: 1
          if-no-files-found: error

  # What OpenTofu can't manage, checked with scripts/oob.py whenever main is planned (spec: ci-apply;
  # run-oob-check-daily design D1-D5). Neither this nor the plan waits for the other. A difference, or
  # a check it couldn't read, fails this job: that failed run is how drift outside OpenTofu reaches
  # the owner. It runs every check a hand run does, and its summary lists them.
  oob:
    name: drift (out of band)
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: plan-main
      deployment: false
    permissions:
      contents: read
    steps:
      - name: The commit to check
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      # Only reads, whatever the App may do: GitHub grants the token exactly these (design D2). The
      # action passes every permission-* input to GitHub, so permission-issue-types works though it
      # isn't one of the action's declared inputs, and the runner warns "Unexpected input".
      - name: A read-only token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 5272634
          private-key: ${{ secrets.TF_VAR_github_app_pem }}
          owner: troupe-run
          repositories: troupe,.github,infrastructure,website
          permission-contents: read
          permission-issues: read
          permission-administration: read
          permission-organization-administration: read
          permission-organization-projects: read
          permission-issue-types: read
      - name: Check what OpenTofu can't manage
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: uv run --no-project scripts/oob.py --ci

  apply:
    name: apply (main)
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The owner's approval of the plan above (spec: ci-apply).
    environment: apply
    env:
      TF_VAR_github_app_pem: ${{ secrets.TF_VAR_github_app_pem }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_billing_email: ${{ secrets.TF_VAR_billing_email }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # The same commit as the plan: applying a saved plan refuses inputs that differ (design D3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-tfplan
          path: tofu
      - name: Apply the approved plan
        id: apply
        run: |
          uv run --no-project scripts/tofu.py init -input=false -no-color
          uv run --no-project scripts/tofu.py apply -input=false -no-color main.tfplan
      # Only after an apply that succeeded: a failed one's modes stay for the next plan
      # (executable-hooks design D4). The token reaches only the repositories the plan named.
      - name: Token for setting modes
        id: mode-token
        if: steps.apply.outcome == 'success' && needs.plan.outputs.mode_repositories != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 5272634
          private-key: ${{ secrets.TF_VAR_github_app_pem }}
          owner: troupe-run
          repositories: ${{ needs.plan.outputs.mode_repositories }}
          permission-contents: write
      - name: Set delivered files' modes as the App
        if: steps.apply.outcome == 'success' && needs.plan.outputs.mode_repositories != ''
        env:
          GH_TOKEN: ${{ steps.mode-token.outputs.token }}
        run: uv run --no-project scripts/hook_modes.py apply --mode-plan tofu/mode-plan.json
      # From here on, run even when the apply failed part way: its state is still the truth.
      - name: Keep the state
        if: always() && steps.apply.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-after-apply
          path: tofu/terraform.tfstate
          retention-days: 90
          if-no-files-found: error
      - name: Token for the state commit
        id: token
        if: always() && steps.apply.outcome != 'skipped'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 5272634
          private-key: ${{ secrets.TF_VAR_github_app_pem }}
          repositories: infrastructure
      - name: Commit the state to main as the App
        if: always() && steps.apply.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Skips an unchanged state; otherwise commits it on the blob the plan was made from, so a
        # main changed since gets a 409 instead of an overwrite, and the state stays in the artifact
        # above (ci-apply design D4). The request is built in memory: the state is too big for one
        # command-line argument (fix-state-commit).
        run: >-
          uv run --no-project scripts/commit_state.py --repo "$GITHUB_REPOSITORY" --branch main
          --path tofu/terraform.tfstate --planned "$SHA" --run-url "$RUN_URL"

  # The board's descriptions the approved plan listed, set with the troupe-run-board App's token,
  # whose key only infrastructure's main-only board environment holds (spec: labels, board-credentials;
  # board-capability-descriptions design D1). The owner approved them with the plan; this job asks
  # nothing more. Only after an apply that succeeded, as the modes are (executable-hooks design D4).
  # board_options.py refuses a field that changed since the plan, and an option without its id.
  board:
    name: board descriptions (main)
    needs: [plan, apply]
    if: needs.apply.result == 'success' && needs.plan.outputs.board_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: board
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-tfplan
          path: tofu
      - name: Token for the board
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: troupe-run
          permission-organization-projects: write
      - name: Set the board's descriptions as the board App
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: uv run --no-project scripts/board_options.py apply --board-plan tofu/board-plan.json
