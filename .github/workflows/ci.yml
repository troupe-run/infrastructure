name: CI

# The repo's check (scripts/check.py, design D8) and the guard's tests. It needs no secret.
#
# Each run tests something no other run does (#66, dedupe-ci-runs; #232, ci-once-per-commit):
# - a pull request that's ready for review, once per update, merged onto main. A branch's own push
#   doesn't run it again: nothing reaches main without a pull request. A draft runs no tests: an
#   agent marks it ready once Claude's review of its last push is clean, and `ready_for_review`
#   runs them then (docs/development-workflow.md).
# - each commit a merge queue tests: main with the pull requests ahead of it and this one's
#   commits, in full, as main is (merge-queue design D4). `changes` doesn't run, so nothing skips.
# - a push to main, unless the merge queue already passed that exact commit
#   (scripts/queue_passed.py). Then `check` and the legs skip, `guard tests` passes, and the run
#   is green, so tofu.yml's plan of main follows it as after any green run. A commit the queue
#   didn't pass runs everything.
# - not the App's state commit after an apply: it changes only the state file, and tofu.yml's
#   plan skips it too.
#
# A pull request runs what its paths need (#78, run-checks-by-path; spec: ci-apply):
#
#   changes      what the changed paths need: guard.py check-scope reads scripts/check-paths.toml,
#                and scripts/guard_tests_needed.py says whether the guard's legs must run. On a
#                draft, nothing; on a push to main, nothing or everything (above)
#   check        skipped when only skipped paths changed, scoped when only scoped ones did, and
#                otherwise the full check
#   guard tests  the required check for the legs: it passes when they passed, or were skipped
#                because nothing they test changed. A skipped matrix job reports under its
#                unexpanded name, so the legs themselves can't be required (design D6).
#
# A failed `changes` runs everything. Everything runs on main once per commit (design D7, as
# ci-once-per-commit design D1 changes it): a guard delivery needs every OS green, and the queue's
# run gave that for the commit it passed. `changes` and `guard tests` run on every push, so the run
# is never all-skipped, which GitHub concludes `skipped`, not `success`.
on:
  pull_request:
    # GitHub's default types, written out because naming one replaces them, and ready_for_review:
    # marking a draft ready runs what a draft skipped (ci-once-per-commit design D2).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore: [tofu/terraform.tfstate]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what does it need?
    # A pull request and a push to main; a merge group runs everything (ci-once-per-commit
    # design D2). Exactly one of the three answering steps runs.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # queue_passed.py reads CI's merge-queue runs.
      actions: read
    outputs:
      scope: ${{ steps.draft.outputs.scope || steps.main.outputs.scope || steps.paths.outputs.scope }}
      check-args: ${{ steps.draft.outputs['check-args'] || steps.main.outputs['check-args'] || steps.paths.outputs['check-args'] }}
      guard: ${{ steps.draft.outputs.guard || steps.main.outputs.guard || steps.paths.outputs.guard }}
    steps:
      - name: A draft runs nothing until it's ready
        id: draft
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::notice::A draft: check and the guard's legs run when it's marked ready for review."
          printf 'scope=none\ncheck-args=\nguard=false\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
      # It always exits 0: a failed read answers "everything", with a warning, since a red run here
      # would hold up the plan of main (ci-once-per-commit design D3).
      - name: Did the merge queue pass this commit?
        id: main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          python3 scripts/queue_passed.py --repository "$GITHUB_REPOSITORY" --sha "$SHA" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
      - name: The pull request's changed paths
        id: paths
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/paths"
          uv run --no-project scripts/guard.py check-scope < "$RUNNER_TEMP/paths" >> "$GITHUB_OUTPUT"
          python3 scripts/guard_tests_needed.py < "$RUNNER_TEMP/paths" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  check:
    name: check
    # A required check. Skipped, which counts as passed, only when `changes` succeeded and answered
    # scope=none: only skipped paths changed, a draft, or a push the merge queue passed. With no
    # answer (a merge group, or a failed `changes`) it runs in full.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: Install
        run: uv sync --locked
      - name: Check (the same script as local runs)
        env:
          # `--scope <name>` words, or nothing for the full check. Scope names are [a-z][a-z0-9_]*,
          # so they split on spaces safely.
          CHECK_ARGS: ${{ needs.changes.outputs['check-args'] }}
        run: uv run scripts/check.py $CHECK_ARGS

  guard-tests:
    # The guard's hooks run on contributors' machines, so its tests run on every OS and Python
    # version troupe supports: 3.12 to 3.15 since troupe-run/troupe#110 (development-workflow
    # design D10, python-3-14-3-15). The check job above covers Linux on 3.12. Not required
    # themselves: `guard tests` below reports for them.
    name: guard tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.guard == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        exclude:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: The guard's tests
        # Every test_guard_*.py file, selected by pytest rather than listed here.
        run: uv run pytest scripts/tests -o python_files=test_guard_*.py

  guard-tests-result:
    name: guard tests
    # The required check for the legs (design D6). always(): it must report whatever they did.
    needs: [changes, guard-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The legs' result
        env:
          LEGS: ${{ needs.guard-tests.result }}
          CHANGES: ${{ needs.changes.result }}
          GUARD: ${{ needs.changes.outputs.guard }}
        run: python3 scripts/guard_tests_needed.py --result "$LEGS" "$CHANGES" "$GUARD"
