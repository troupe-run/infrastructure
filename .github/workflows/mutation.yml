name: mutation

# Nightly mutation testing of the repositories scripts/mutation.json lists (today troupe alone;
# #332), which keeps one test-quality issue per module under its threshold or baseline (spec:
# mutation-testing; #325; lint-mutation design D3-D8). It runs on no pull request and is no required
# check, so it never blocks a merge.
#
#   targets  contents read                          reads the list, and checks a dispatch names one
#                                                   of its repositories
#   mutate   no secret; contents and actions read   checks out a repository's main, runs mutmut or
#                                                   Stryker within the budget (scripts/mutation.json),
#                                                   and hands on its report, the repository's
#                                                   quality-gates.toml, and nothing else
#   issues   env mutation-issues (main only)        reads the reports as data and keeps the issues,
#                                                   with the troupe-run-test-quality App's token
#   board    env board (main only)                  adds each issue it opened to the troupe roadmap
#                                                   board, with the board App's token
#
# A dispatch can name one repository, and can be a dry run: every module's score and what it would
# open, update or close go to the run's summary, and nothing is written (design D6's calibration).
on:
  # 03:23 UTC nightly, off the hour. Each run resumes from the last one's kept mutmut state, so a
  # night re-tests only what changed (#378). The schedule watch reports it if GitHub stops running
  # it (scripts/watched-schedules.json).
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "One repository scripts/mutation.json lists, or all"
        type: string
        default: all
      dry-run:
        description: "Report every score and what would change, and write nothing"
        type: boolean
        default: false
      unit:
        description: "One unit of the repository, run whole so it resumes (no module globs), or blank for all"
        type: string
        default: ""
      full-refresh:
        description: "Discard the kept mutmut state and fill afresh"
        type: boolean
        default: false

permissions: {}

# Two runs at once could each open an issue for the same module.
concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  targets:
    name: the repositories to mutate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repositories: ${{ steps.list.outputs.repositories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/mutation.json
          sparse-checkout-cone-mode: false
      # The one list of repositories that get coverage and mutation testing (spec: mutation-testing).
      - name: The repositories the list names
        id: list
        env:
          NAMED: ${{ inputs.repository || 'all' }}
        run: |
          set -euo pipefail
          listed=$(jq -c '.repositories | keys_unsorted' scripts/mutation.json)
          if [[ "$NAMED" != all ]] && ! jq -e --arg named "$NAMED" 'index($named) != null' <<<"$listed" >/dev/null; then
            printf "::error::%s isn't in scripts/mutation.json's repositories, which lists %s. Fix: name one of them, or all.\n" "$NAMED" "$listed"
            exit 1
          fi
          echo "repositories=$listed" >> "$GITHUB_OUTPUT"

  mutate:
    name: mutate ${{ matrix.repository }}
    needs: targets
    runs-on: ubuntu-latest
    # budget_minutes (scripts/mutation.json) plus 30 for setup and the report; a test holds the two
    # together.
    timeout-minutes: 270
    permissions:
      contents: read
      actions: read # the previous run's report, for attributing new survivors (design D8)
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.targets.outputs.repositories) }}
    steps:
      - name: Skip a repository the dispatch didn't name
        id: skip
        env:
          NAMED: ${{ inputs.repository || 'all' }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          mkdir -p out
          if [[ "$NAMED" != all && "$NAMED" != "$REPOSITORY" ]]; then
            touch "out/skipped-$REPOSITORY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # This repository's main: the scripts and their settings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.skip.outputs.skip != 'true'
        with:
          path: infra
      # The repository under test, at its main, with its history for git blame (design D8).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.skip.outputs.skip != 'true'
        with:
          repository: troupe-run/${{ matrix.repository }}
          ref: main
          path: target
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.skip.outputs.skip != 'true' && matrix.repository == 'website'
        with:
          node-version-file: target/.nvmrc
      # infrastructure's tests run tofu and, in GitHub Actions, tflint (its check's gates), at the versions its
      # CI uses; a test holds tflint's to .tflint.hcl.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.skip.outputs.skip != 'true' && matrix.repository == 'infrastructure'
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.skip.outputs.skip != 'true' && matrix.repository == 'infrastructure'
        with:
          tflint_version: v0.66.0
          tflint_wrapper: false
      - name: The previous run's tested commit
        id: previous
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w mutation.yml -s success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run" ]] || { echo "No previous successful run: nothing is called new."; exit 0; }
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name == \"report-$REPOSITORY\" and .expired == false) | .id" | head -n1)
          [[ -n "$artifact" ]] || { echo "Run $run kept no report for $REPOSITORY: nothing is called new."; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/previous.zip"
          unzip -o -q "$RUNNER_TEMP/previous.zip" -d "$RUNNER_TEMP/previous"
          # A dispatch that named another repository kept only a skipped marker for this one.
          if [[ ! -f "$RUNNER_TEMP/previous/report-$REPOSITORY.json" ]]; then
            echo "Run $run didn't mutate $REPOSITORY: nothing is called new."
            exit 0
          fi
          commit=$(jq -r '.commit' "$RUNNER_TEMP/previous/report-$REPOSITORY.json")
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::the previous report for %s names no commit: %q\n' "$REPOSITORY" "$commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # The kept mutmut state (#378, mutation-incremental design D1): one cache entry per repository
      # per run, holding each unit's .meta files and stats; the newest for this mutmut version wins.
      - name: The kept state's cache key
        id: state
        if: steps.skip.outputs.skip != 'true'
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          mutmut=$(jq -r '.tools.mutmut' infra/scripts/mutation.json)
          prefix="mutmut-state-$REPOSITORY-mutmut$mutmut-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Restore the kept state
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: ${{ steps.state.outputs.key }}
          restore-keys: ${{ steps.state.outputs.prefix }}
      - name: Install the repository and the tool
        if: steps.skip.outputs.skip != 'true'
        working-directory: target
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          mutmut=$(jq -r '.tools.mutmut' ../infra/scripts/mutation.json)
          if [[ "$REPOSITORY" == website ]]; then
            npm ci
          else
            uv sync --locked
            uv pip install "mutmut==$mutmut"
          fi
      - name: Mutate
        if: steps.skip.outputs.skip != 'true'
        working-directory: target
        env:
          REPOSITORY: ${{ matrix.repository }}
          PREVIOUS: ${{ steps.previous.outputs.commit }}
          UNIT: ${{ inputs.unit }}
          MUTATION_STATE: ${{ github.workspace }}/state
          MUTATION_PREVIOUS_STATE: ${{ runner.temp }}/previous/state-${{ matrix.repository }}.json
          MUTATION_FULL_REFRESH: ${{ inputs.full-refresh }}
          MUTATION_RUN_ID: ${{ github.run_id }}
          RESOURCES: ${{ github.workspace }}/out/resources-${{ matrix.repository }}.log
          PEAKS: ${{ github.workspace }}/out/peaks-${{ matrix.repository }}.log
          MUTATION_SCRIPTS: ${{ github.workspace }}/infra/scripts
        run: |
          set -euo pipefail
          # resources: begin
          # The runner's memory, swap, disk and load once a minute while mutmut runs, to the log and to a
          # file uploaded with the report, so a lost runner leaves what it last saw (#337; design D1).
          mkdir -p "$(dirname "$RESOURCES")"
          resources_since=$(date '+%Y-%m-%d %H:%M:%S')
          sample_resources() {
            local meminfo=${RESOURCES_MEMINFO:-/proc/meminfo} loadavg=${RESOURCES_LOADAVG:-/proc/loadavg} line
            while :; do
              line="$(date -u +%H:%M:%S)"
              line+=" mem_available_mb=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' "$meminfo")"
              line+=" swap_free_mb=$(awk '/^SwapFree:/ {print int($2 / 1024)}' "$meminfo")"
              line+=" disk_free_mb=$(df -Pm . | awk 'NR == 2 {print $4}')"
              line+=" load1=$(cut -d' ' -f1 "$loadavg")"
              # mutmut's children are titled "mutmut: <mutant>": these are the mutants running at once.
              line+=" mutmut_processes=$( (pgrep -f '^mutmut: ' || true) | wc -l | tr -d ' ')"
              echo "resources: $line"
              echo "$line" >> "$RESOURCES"
              sleep "${RESOURCES_SECONDS:-60}"
            done
          }
          lowest_resources() {
            kill "$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
            local lowest
            lowest=$(awk '{split($2, f, "="); if (min == "" || f[2] + 0 < min + 0) {min = f[2]; at = $1}}
              END {if (min != "") print min " at " at}' "$RESOURCES" 2>/dev/null || true)
            if [[ -n "$lowest" ]]; then
              echo "resources: lowest mem_available_mb=$lowest"
              echo "Mutation run: lowest free memory: ${lowest/ at / MB at } UTC" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
            # Who ended the run, if the host did: since the step began, the lines from the sources that can
            # name a sender (the kernel's OOM lines, systemd-oomd, and systemd on the runner's service or
            # this run's mutation-* scope), to the log and beside the readings (#361; dry run 44633465646).
            # journal-<repository>.log beside resources-<repository>.log, never the readings file itself.
            local journal="${RESOURCES%/*}/journal-${RESOURCES##*/}"
            journal=${journal/journal-resources-/journal-}
            { sudo -n journalctl --since "$resources_since" --no-pager -o short-iso 2>/dev/null || true; } \
              | grep -iE 'kernel: .*(out of memory|oom-kill|oom_reaper|memory cgroup|killed process)|systemd-oomd|systemd\[1\]: .*(actions\.runner|mutation-[^ ]*\.scope)' \
              | tail -n 200 > "$journal" || true
            if [[ -s "$journal" ]]; then sed 's/^/journal: /' "$journal"; else rm -f "$journal"; fi
            # The memory peaks, from the uploaded file: an OOM kill of the run took a summary the run
            # printed itself down with it (#371; dry run 44673717060).
            if [[ -n "${PEAKS:-}" && -s "$PEAKS" ]]; then
              python3 "$MUTATION_SCRIPTS/mutation_run.py" peaks "$PEAKS" || true
            fi
          }
          sample_resources &
          sampler=$!
          trap lowest_resources EXIT
          # resources: end
          args=("$REPOSITORY" . "../out/report-$REPOSITORY.json")
          [[ -z "$PREVIOUS" ]] || args+=(--previous "$PREVIOUS")
          # A whole unit, never module globs: mutmut re-runs every mutant a glob names (#378).
          if [[ -n "${UNIT:-}" ]]; then args+=(--unit "$UNIT"); fi
          # containment: begin
          # The mutation runs in a PID namespace, a session and a cgroup of its own, as the runner's user with the
          # step's environment: a mutant that signals every process (kill -1) or its own group (kill 0), or a run
          # that exhausts memory, ends at most the run, never the runner agent (#345; probe
          # troupe-run/infra-probe-runner-killall). sudo resets the environment, so it's saved and restored
          # inside; systemd-run doesn't expand $ in the command; setsid gives the run its own process group,
          # which a PID namespace alone doesn't. That bash stays pid 1, the namespace's init: it runs the command
          # in the foreground (keeping its stdin and signal dispositions), and reaps every orphan reparented
          # to it, which the command, as pid 1, wouldn't (#347).
          run_contained() {
            local memory=${MUTATION_MEMORY_MAX:-12G} tasks=${MUTATION_TASKS_MAX:-8192}
            local unit="mutation-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-job}-$RANDOM" since saved status=0
            since=$(date '+%Y-%m-%d %H:%M:%S')
            saved=$(mktemp)
            export -p > "$saved"
            sudo systemd-run --scope --quiet --expand-environment=no --unit="$unit" \
                -p MemoryMax="$memory" -p MemorySwapMax=0 -p TasksMax="$tasks" \
              unshare --pid --fork --mount-proc --kill-child \
              setsid --wait \
              setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
              bash -c 'source "$1"; shift; "$@"; exit $?' restore "$saved" "$@" || status=$?
            rm -f "$saved"
            if (( status != 0 )); then
              if sudo journalctl -k --since "$since" --no-pager 2>/dev/null | grep -F "$unit" | grep -qi "oom"; then
                echo "::error::the mutation run ran out of memory (MemoryMax $memory)"
              elif (( status > 128 )); then
                echo "::error::the mutation run was killed by signal $((status - 128))"
              else
                echo "::error::the mutation run exited with status $status"
              fi
            fi
            return "$status"
          }
          # containment: end
          if [[ "$REPOSITORY" == website ]]; then
            run_contained python3 ../infra/scripts/mutation_run.py "${args[@]}"
          else
            run_contained uv run --no-sync python ../infra/scripts/mutation_run.py "${args[@]}"
          fi
          if [[ -f quality-gates.toml ]]; then
            cp quality-gates.toml "../out/quality-gates-$REPOSITORY.toml"
          fi
      # The save, on any outcome, so what a run the budget or a failure stops finished is kept (D1).
      # Two runs overlapping despite the concurrency group mustn't drop each other's progress on a
      # unit only one ran, so the newest entry is restored again and only this run's units replace
      # it (D1a): actions/cache restores an entry only to the path it was saved from.
      - name: Set this run's state aside
        if: always() && steps.skip.outputs.skip != 'true' && hashFiles('out/state-*.json') != ''
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/state-mine"
          if [[ -d state ]]; then mv state "$RUNNER_TEMP/state-mine"; else mkdir "$RUNNER_TEMP/state-mine"; fi
      - name: Restore the newest kept state again
        if: always() && steps.skip.outputs.skip != 'true' && hashFiles('out/state-*.json') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: ${{ steps.state.outputs.prefix }}newest
          restore-keys: ${{ steps.state.outputs.prefix }}
      - name: Keep this run's units over the newest kept state
        if: always() && steps.skip.outputs.skip != 'true' && hashFiles('out/state-*.json') != ''
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: python3 infra/scripts/mutation_run.py state-merge "$RUNNER_TEMP/state-mine" state "out/state-$REPOSITORY.json"
      - name: Save the kept state
        if: always() && steps.skip.outputs.skip != 'true' && hashFiles('out/state-*.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: ${{ steps.state.outputs.key }}
      # actions/cache only warns when a save fails; a lost save must fail the run (D4).
      - name: Check the kept state was saved
        if: always() && steps.skip.outputs.skip != 'true' && hashFiles('out/state-*.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.state.outputs.key }}
        run: |
          set -euo pipefail
          found=$(gh cache list -R "$GITHUB_REPOSITORY" --key "$KEY" --json key --jq "map(select(.key == \"$KEY\")) | length")
          if [[ "$found" != 1 ]]; then
            echo "::error::the kept mutmut state wasn't saved as $KEY: tonight's progress is lost, and the next run restores the previous entry"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.repository }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
      # Stryker's own report, for the survivors past the 30 an issue lists.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.repository == 'website' && steps.skip.outputs.skip != 'true' }}
        with:
          name: stryker-html
          path: target/reports/mutation/
          if-no-files-found: ignore

  issues:
    name: keep the issues
    # A repository whose job failed has no report, which the script reports by name after handling
    # the others, so this runs on any outcome but cancelled.
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Limited to main, and holds only the troupe-run-test-quality App's key
    # (spec: mutation-issue-credentials).
    environment:
      name: mutation-issues
      deployment: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      issue-urls: ${{ steps.issues.outputs.issue-urls }}
    steps:
      # This repository's main only: no repository's code under test is checked out here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      # Only the permissions the App is declared with in oob/app-installations.json; a test holds
      # the two together (#238).
      - name: Mint the troupe-run-test-quality App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TEST_QUALITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEST_QUALITY_APP_PRIVATE_KEY }}
          owner: troupe-run
          permission-issues: write
      - name: Keep the issues
        id: issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # This run's own token, read-only: which pull request a survivor's commit came from. The
          # App's token is issues-only, and can't read pull requests (design D8).
          READ_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: uv run --no-project scripts/mutation_issues.py reports $DRY_RUN

  board:
    name: put the issues on the board
    needs: issues
    if: ${{ !cancelled() && needs.issues.outputs.issue-urls != '' && needs.issues.outputs.issue-urls != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: board
      deployment: false
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: troupe-run
          permission-organization-projects: write
      - name: Add each issue to the troupe roadmap board
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_URLS: ${{ needs.issues.outputs.issue-urls }}
        run: |
          set -euo pipefail
          # What issues hands over is checked before it's used: a JSON list of issue URLs in the
          # repositories it serves.
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ISSUE_URLS" >/dev/null; then
            printf '::error::issue-urls from the issues job is not a JSON list of strings: %q\n' "$ISSUE_URLS"
            exit 1
          fi
          mapfile -t urls < <(jq -r '.[]' <<<"$ISSUE_URLS")
          for ISSUE_URL in "${urls[@]}"; do
            if [[ ! "$ISSUE_URL" =~ ^https://github\.com/troupe-run/(troupe|website|infrastructure)/issues/[0-9]+$ ]]; then
              printf '::error::issue-urls holds something that is not an issue it serves: %q\n' "$ISSUE_URL"
              exit 1
            fi
          done
          for ISSUE_URL in "${urls[@]}"; do
            gh project item-add 1 --owner troupe-run --url "$ISSUE_URL"
            echo "Added $ISSUE_URL"
          done
