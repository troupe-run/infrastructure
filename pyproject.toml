# Repository tooling only: the OpenTofu wrapper, the out-of-band drift checks and scripts/check.py.
# Not a distributable package. See openspec/changes/archive/2026-10-11-adopt-org/design.md (D4, D6, D8).
[project]
name = "troupe-infrastructure"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.1",
    "hypothesis>=6.168",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and drive the scripts through subprocess with trusted arguments.
"scripts/tests/**" = ["S101", "S603", "S607"]
# Repository scripts run fixed tools (tofu, op, gh, uv) from PATH.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts"]
explicit_package_bases = true
mypy_path = ["scripts", "scripts/tests"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
