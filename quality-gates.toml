# The merge gates' thresholds for this repository (spec: quality-gates). scripts/quality_gates.py reads it strictly:
# an unknown key or a wrong type fails the check. It isn't delivered: troupe and website keep their own. Defaults
# approved by the owner on 2026-11-18 (openspec/changes/archive/2026-11-18-quality-gates/design.md, "Owner's
# decisions").
version = 1

# No [coverage]: coverage and mutation testing apply only to the repositories scripts/mutation.json's `repositories`
# names, and it doesn't name infrastructure (#332, owner 2026-11-18). CI's leg still runs the audit. To measure coverage
# here again, add infrastructure to that list and a [coverage] table here, in one pull request.

# Cyclomatic complexity (lizard) of each function a change adds or edits: above the limit, it may not be new or more
# complex than before. guard.py is measured here, where it's the source.
[complexity]
block_above = 25
languages = ["python"]
exclude = ["**/tests/**"]

# A pull request that changes the lock file fails on an advisory of these severities that has a fix.
[audit]
lock_files = ["uv.lock"]
block = ["high", "critical"]

# The size in bytes of each file a change adds or changes (#271): above block_above it may not be new or larger than
# before, unless [size.allow] gives it its own ceiling; above warn_above it's noted. A review reads every changed file
# whole, and one Read holds about 25,000 tokens. Limits set by the owner on 2026-11-19
# (openspec/changes/archive/2026-11-19-gate-files/design.md, D5 and D6). Fixtures, archived changes, the lock file and
# the state aren't reviewed as code, so they aren't measured; binary files never are.
[size]
block_above = 49152
warn_above = 32768
exclude = ["**/fixtures/**", "openspec/changes/archive/**", "uv.lock", "tofu/terraform.tfstate"]

# The files over block_above on 2026-11-19, each capped at its size then plus 16 KiB. Each has an issue to split it.
# Remove an entry once its file is under block_above: the check fails on an entry that's no longer needed.
[size.allow]
"scripts/guard.py" = 222208
"scripts/tests/test_claude_review_workflow.py" = 195584
".github/workflows/claude-review.yml" = 136192
"openspec/specs/development-workflow/spec.md" = 116736
"docs/development-workflow.md" = 90112
"scripts/tests/test_guard_dependabot.py" = 77824
"scripts/tests/test_dependabot_issues.py" = 74752
"openspec/specs/pr-review/spec.md" = 67584
