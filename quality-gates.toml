# The merge gates' thresholds for this repository (spec: quality-gates). scripts/quality_gates.py reads it strictly:
# an unknown key or a wrong type fails the check. It isn't delivered: troupe and website keep their own. Defaults
# approved by the owner on 2026-11-18 (openspec/changes/archive/2026-11-18-quality-gates/design.md, "Owner's
# decisions").
version = 1

# No [coverage]: coverage and mutation testing apply only to the repositories scripts/mutation.json's `repositories`
# names, and it doesn't name infrastructure (#332, owner 2026-11-18). CI's leg still runs the audit. To measure coverage
# here again, add infrastructure to that list and a [coverage] table here, in one pull request.

# Cyclomatic complexity (lizard) of each function a change adds or edits: above the limit, it may not be new or more
# complex than before. guard.py is measured here, where it's the source.
[complexity]
block_above = 25
languages = ["python"]
exclude = ["**/tests/**"]

# A pull request that changes the lock file fails on an advisory of these severities that has a fix.
[audit]
lock_files = ["uv.lock"]
block = ["high", "critical"]
